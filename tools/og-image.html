<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share preview source</title>
<!--
  The source for og-image.png, the picture that shows when a link to the
  page is shared. Edit this, then run:  node tools/make-og-image.mjs
  It is rendered at 1200x630, the size every link unfurler expects, with the
  page's own fonts and palette so the preview looks like the thing it links
  to. Nothing here is loaded by the page itself.
-->
<style>
@font-face {
  font-family: 'Instrument Sans';
  font-style: normal;
  font-weight: 400 700;
  src: url('../vendor/fonts/instrument-sans-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'IBM Plex Mono';
  font-style: normal;
  font-weight: 400;
  src: url('../vendor/fonts/ibm-plex-mono-latin.woff2') format('woff2');
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  background: #fcfcfb;
  font-family: 'Instrument Sans', -apple-system, sans-serif;
  color: #0b0b0b;
  display: flex; align-items: center;
  -webkit-font-smoothing: antialiased;
}

/* The blue edge, so the preview is recognizable as this app at thumbnail
   size, where the words are too small to read. */
.edge { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #2a78d6; }

.left { padding: 0 0 0 78px; width: 620px; flex: none; }
/* The icon and the name, and no address: anyone can host this anywhere, so
   the picture names no host. index.html carries the one absolute URL that
   an unfurler needs. */
.mark { display: flex; align-items: center; gap: 26px; }
.mark .tile {
  width: 96px; height: 96px; border-radius: 22px; background: #2a78d6;
  display: grid; place-items: center; flex: none;
}
/* Full bleed in the tile: icon.svg already keeps the bars well inside its
   own 192-unit frame, so insetting it again here would shrink them twice
   and stop the mark matching the home screen icon. */
.mark svg { width: 100%; height: 100%; display: block; }
h1 { font-size: 86px; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
p {
  margin-top: 24px; font-size: 29px; line-height: 1.38;
  color: #52514e; max-width: 17ch;
}
.facts {
  margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap;
  font-size: 19px; font-weight: 600; color: #52514e;
}
.facts span {
  border: 1px solid #e1e0d9; background: #ffffff;
  border-radius: 999px; padding: 9px 17px;
}

/* A hand of cards, drawn the way the list draws them. */
.fan { position: relative; flex: 1; height: 630px; }
.card {
  position: absolute; left: 70px; width: 440px; height: 176px;
  border-radius: 22px; padding: 26px 28px;
  display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: 0 18px 40px rgba(11, 11, 11, .18);
  overflow: hidden;
}
.card::after {
  content: ""; position: absolute; right: -10px; bottom: -14px;
  width: 232px; height: 104px; opacity: .17;
  background-image: repeating-linear-gradient(90deg,
    currentColor 0 5px, transparent 5px 11px, currentColor 11px 15px, transparent 15px 24px,
    currentColor 24px 28px, transparent 28px 35px, currentColor 35px 44px, transparent 44px 49px);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 35%);
}
.card .label {
  font-size: 15px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  opacity: .72; margin-bottom: 6px; position: relative; z-index: 1;
}
.card .name {
  font-size: 31px; font-weight: 600; letter-spacing: -.015em; position: relative; z-index: 1;
}
.card .num {
  font-family: 'IBM Plex Mono', monospace; font-size: 20px;
  position: relative; z-index: 1;
}
/* Spaced so that no card's number is covered by the one below it: each is
   176 tall on a 190 step, and a rotation dips a corner by about 20 more. */
.c1 { top: 34px;  background: #1baf7a; color: #0b0b0b; transform: rotate(-5deg); }
.c2 { top: 220px; background: #eb6834; color: #ffffff; transform: rotate(-2deg); left: 100px; }
.c3 { top: 406px; background: #2a78d6; color: #ffffff; transform: rotate(1.5deg); left: 58px; }
</style>
</head>
<body>
<div class="edge"></div>

<div class="left">
  <div class="mark">
    <div class="tile">
      <svg viewBox="0 0 192 192" aria-hidden="true">
        <g fill="#ffffff">
          <rect x="46" y="54" width="7" height="68"/><rect x="58" y="54" width="4" height="68"/>
          <rect x="67" y="54" width="11" height="68"/><rect x="83" y="54" width="4" height="68"/>
          <rect x="92" y="54" width="7" height="68"/><rect x="104" y="54" width="4" height="68"/>
          <rect x="113" y="54" width="9" height="68"/><rect x="127" y="54" width="4" height="68"/>
          <rect x="136" y="54" width="10" height="68"/>
          <rect x="46" y="133" width="100" height="9" rx="4.5"/>
        </g>
      </svg>
    </div>
    <h1>My Cards</h1>
  </div>

  <p>Loyalty card barcodes, full screen at the till.</p>

  <div class="facts">
    <span>No account</span>
    <span>No server</span>
    <span>Works offline</span>
  </div>
</div>

<div class="fan">
  <div class="card c1">
    <div><div class="label">Member</div><div class="name">City Library</div></div>
    <div class="num">A2983471B</div>
  </div>
  <div class="card c2">
    <div><div class="label">Points</div><div class="name">Northside Pharmacy</div></div>
    <div class="num">NSP4472-8810</div>
  </div>
  <div class="card c3">
    <div><div class="label">Loyalty</div><div class="name">Greenfield Market</div></div>
    <div class="num">5901234567893</div>
  </div>
</div>
</body>
</html>
